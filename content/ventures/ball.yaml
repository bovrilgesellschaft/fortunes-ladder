  - id: steward
    num: IV
    phase: The Crisis
    title: The Steward’s Errand
    sid: ball.04b.steward
    dev: |-
      requires suspicious ∨ letterKept · replaces the Wiltshire crisis
      Press on, or withdraw.
    text: |-
      At half past twelve a steward in black comes through the card room with a folded paper in his hand. You know it at once, because you wrote it.

      He gives it to Lady Bellaston. Lady Bellaston puts up her glass, reads it again, and looks slowly across the room at you. It is the look of a hostess who has found a mouse in the syllabub and is deciding whether to scream.
    ask: Press on, or withdraw?
    options:
