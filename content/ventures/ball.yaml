        story:
          T:
            sm: Seeing her letter delivered up, she crossed the room before her hostess could open her mouth, and confessed the whole as a frolic, so prettily that Lady Bellaston resolved the joke should be her own; and by two in the morning was telling it with improvements, and had taken her up as the cleverest woman in London.
            st: Confess everything, — said a small voice within her, — it is the one lie they will never expect. And so she did; and Lady Bellaston laughed, and kept her; which is the whole history of Lady Bellaston’s friendships, and of most others.
          X:
            sm: Lady Bellaston screamed. It was not a loud scream; but in Hanover Square a small scream will carry as far as a cannon at Woolwich.
            st: Lady Bellaston screamed. * * * * * * * * — I leave the reader these asterisks, to scream into on her behalf.
