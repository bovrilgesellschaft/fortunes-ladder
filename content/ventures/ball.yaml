  - id: pounce
    num: IV
    phase: The Crisis
    title: A Voice from Wiltshire
    sid: ball.04.pounce
    dev: |-
      requires ¬suspicious ∧ ¬letterKept · threatens the Origin Secret (Kitty Glover, the curate’s daughter)
      Press on, or withdraw.
    text: |-
      It is past one, and the candles are guttering, when you hear it: a high, precise, clerical voice that you have not heard since you were seventeen, saying grace over a boiled fowl at your father’s table.

      The Reverend Dr Pounce, once Rural Dean of your father’s deanery, now chaplain to a bishop and fatter by a stone, is at the punch-bowl. He has seen you. He is looking at you with the expression of a man trying to remember where he left a sermon.

      Kitty Glover left Wiltshire under a cloud. Mrs Delacourt has never been to Wiltshire in her life.
    ask: Press on, or withdraw?
    options:
      - label: "Press on: go straight up to him, and ask after the Bishop’s gout as a woman who has never seen him before."
        check:
          attr: Nerve
          diff: 5
          bonus:
            - { when: attrs.Address >= 4, by: 1, why: Address 4 }
        dev: |-
          Press on · Wheel · Nerve 3 + 1 (Address) vs 5.
          T: he decides he has not seen you; Composure +1 · Story
          S: he mentions a likeness (Exposure +1, week 44)
          C: he mentions it to Lady Bellaston (Exposure +2)
          R: he knows you, and will call (Hook on the Secret; Exposure +2)
          X: he says your name aloud; Exposure +3 now and +3 later; Melancholic +1 · Story
        outcomes:
          T:
            effects:
              - { adj: composure, by: 1, why: nerve held }
            text: Dr Pounce looks at you for a long moment, and decides, as men of his cloth so often do, that it is wiser not to have seen something. He tells you that the Bishop’s gout is much improved, and that you remind him of no one at all.
          S:
            effects:
              - rumour:
                  id: pounce
                  week: 44
                  from: The Reverend Dr Pounce
                  text: Dr Pounce has remarked at a dinner in Soho that Mrs Delacourt is the image of a curate’s girl he once knew in Wiltshire.
                  effect: Exposure +1 (Mrs Delacourt)
            text: He answers civilly, but he keeps looking at you as if you were a text he could not place.
          C:
            effects:
              - rumour:
                  id: pounce
                  week: 43
                  from: Lady Bellaston’s drawing room
                  text: Dr Pounce has told Lady Bellaston of a very striking likeness, and Lady Bellaston adores a likeness.
                  effect: Exposure +2 (Mrs Delacourt)
            text: He is civil to your face. Five minutes later you see him bend to Lady Bellaston’s ear.
          R:
            effects:
              - { hook: "Dr Pounce, who knows that Mrs Delacourt is Kitty Glover, and would like to discuss it privately", why: recognised at the punch-bowl }
              - rumour:
                  id: pounce
                  week: 43
                  from: The Reverend Dr Pounce
                  text: Dr Pounce has written to Wiltshire to ask after the curate’s daughter.
                  effect: Exposure +2 (Mrs Delacourt)
            text: “Kitty Glover,” he says, very quietly, and smiles. “I shall not say a word, my dear. But I think I shall call.”
          X:
            effects:
              - { adj: exposure, by: 3, why: named aloud }
              - { adj: hum.Melancholic, by: 1, why: named aloud }
              - rumour:
                  id: pounce
                  week: 42
                  from: Every drawing room in Mayfair
                  text: Mrs Delacourt is said to be a Wiltshire curate’s daughter, and worse.
                  effect: Exposure +3 (Mrs Delacourt) · the Secret is out
            text: “Why, it is Kitty Glover!” cries Dr Pounce, delighted, in the voice he uses for the back of a cathedral. “The curate’s girl! Does your poor father know you are in town?”
        story:
          T:
            sm: Here she was spied by Dr Pounce, a fat divine who had dined at her father’s table a hundred times; but she walked up to him with so fine an assurance, and asked so tenderly after the Bishop’s gout, that the Doctor concluded, like a prudent churchman, that he had seen nothing at all.
            st: Dr Pounce looked at her. She looked at Dr Pounce. — And here, madam, a whole sermon passed between them without a word spoken; at the end of which the Doctor decided he had never seen her in his life; which was the best sermon he ever preached.
          X:
            sm: “Kitty Glover!” cried the Doctor, in the voice he kept for the back of a cathedral; and the name went round Lady Bellaston’s rooms faster than the negus.
            st: — Kitty Glover! — Two words. I have known whole Acts of Parliament do less.
