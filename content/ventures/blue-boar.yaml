# yaml-language-server: $schema=../schema/venture.schema.json
#
# PLACEHOLDER (Step 5): written to exercise the run shell. It introduces Will Gallow and sells
# the hero the pistols and the mask that heath needs. Keep, rewrite or drop it in Step 10.
# Places the canon Blue Boar (bible: "unplaced") in St Giles: a ruling for the bible.

id: blue-boar
title: The Blue Boar
names:                     # on this page; a run draws its own
  given: Cornelius
  surname: Byrne
  county: Galway
  title: Captain
  short_title: Capt.
  alias_surname: O’Rourke
  claim: late of the Imperial service
test: true
offer:
  district: St Giles
  circle: the Underworld
  blurb: A tavern in St Giles where gentlemen of the road are said to drink. A man who wanted to learn the trade might learn it there, if he survived the gin.
  weight: 2
runhead: The Life &amp; Adventures of Mr {name}
sub: Being an Evening among the Gentlemen of the Road, in five Beats
prospectus: >-
  <b>A placeholder Venture,</b> written to exercise the run shell: a flash tavern, an old
  highwayman, a brace of pistols and a thief-taker's man.
year: 1724
week: 20
loot_flag: won
persona: Mr Byrne
who:
  name: Cornelius Byrne
  as: under his own name
  origin: Younger son of an Irish squire · Book II

start:
  purse: £3
  debts: £24
  luck: 1
  exposure: 0
  notoriety: 0
  celebrity: 1
  attrs: { Address: 3, Wit: 2, Nerve: 3, Constitution: 2, Countenance: 2, Learning: 1 }
  hum: { Sanguine: 1, Choleric: 1, Melancholic: 1, Phlegmatic: 0 }
  tags: []
  items: [His father’s sword, "A fine coat, made in Dublin and not paid for"]
  hooks: []

first: tavern

chapter:
  no: Chap. VI.
  opening: In which our Hero keeps low Company
  parts:
    - { when: flags.treated, text: treats a Tavern to Gin }
    - { when: flags.drunk, text: drinks more than is good for him }
    - { when: flags.will, text: makes an old Acquaintance }
    - { when: flags.armed, text: buys a Brace of Pistols }
    - { when: flags.brazen, text: outfaces a Thief-taker }
  last:
    when: flags.withdrew
    text: leaves by the Roof
    else: goes home by the Door, which in St Giles is a Distinction

story:
  title: The History of Mr Cornelius Byrne
  byline: Written up whenever Fortune’s Wheel lands on Triumph or Catastrophe
  preface: It was about this time that our hero, finding that the life of a gentleman cost a great deal more than a gentleman had, began to consider those professions in which a gentleman’s qualities are rewarded at once, and in ready money.
  close: He went home by daylight, with an acquaintance he had not sought and a brace of pistols he could not well afford, and the firm resolution, which young men always form on such occasions, never to use either.

reckoning:
  num: V
  phase: The Reckoning
  title: Home through St Giles
  sid: blueboar.05.reckoning
  dev: Placeholder · nothing further to settle
  steps:
    - when: flags.armed
      say: You walk home through St Giles with a pistol in each pocket and the mask in your hat, and every watchman you pass seems to look at your pockets.
    - when: not flags.armed
      say: You walk home through St Giles with nothing in your pockets worth taking, which in St Giles is the best protection there is.
    - when: flags.will
      say: Will Gallow has told you where to find him, which is to say he has told you where he will not be, and that someone there will know.
  post:
    some: Sealed, and in the post. They will arrive in the weeks ahead, whatever you do next.
    none: Nothing is in the post. St Giles keeps its own counsel, as a rule, and sells it only for cash.
  upkeep: "Upkeep follows: the garret, the coat, and now the pistols, which want powder."
  again: Go back to the Blue Boar
  finis: Finis.

beats:
  - id: tavern
    num: I
    phase: The Approach
    title: The Sign of the Blue Boar
    sid: blueboar.01.tavern
    dev: Placeholder · certain, costed and risky options
    text: |-
      The Blue Boar stands in a court off St Giles High Street, where the houses lean together like drunk men holding each other up. The sign has lost its paint. The boar is now merely blue, or merely a boar, depending on the light.

      Inside are a fire, a dozen men who stop talking when you come in, and a smell of gin so strong you could light it.{fn *} You have heard that gentlemen of the [[pad]] drink here. You have not quite decided why you have come to look at them.
    notes:
      - "* Gin was cheap and untaxed in the 1720s. Parliament’s first attempt to restrain it, the Gin Act, came in 1729."
    ask: How will you make yourself welcome?
    options:
      - label: Stand the room a quartern of gin apiece.
        cost: 1s 6d
        dev: Costed · certain
        do:
          effects: [{ adj: purse, by: -1s 6d, why: gin for the room }, { set: treated }, { adj: hum.Sanguine, by: 1, why: gin }]
          text: The room drinks your gin and looks at you differently. Not kindly, exactly. More as a butcher looks at a good cow.
        next: will
      - label: Drink level with the company.
        dev: Risky · Constitution against 4
        check: { attr: Constitution, diff: 4 }
        outcomes:
          T:
            effects: [{ set: treated }, { adj: hum.Sanguine, by: 1, why: gin }]
            text: You drink glass for glass with a carter, a coiner and a woman who says she is a duchess, and you are the last standing. The room applauds. The duchess kisses you, and you check your pockets afterwards, and everything is there, which you understand to be a great compliment.
          S:
            effects: [{ adj: hum.Sanguine, by: 1, why: gin }]
            text: You hold your gin. The room decides you are not a constable, which in St Giles is the beginning of every friendship.
          C:
            effects: [{ adj: hum.Sanguine, by: 1, why: gin }, { adj: purse, by: -1s, why: "your round, and someone else’s" }]
            text: You hold your gin, and somehow pay for a good deal of other people’s.
          R:
            effects: [{ set: drunk }, { adj: hum.Melancholic, by: 1, why: gin }]
            text: The gin wins. You spend a quarter of an hour explaining to a coal-heaver that your father is a squire in {county}, and the coal-heaver says so is his, and you both weep.
          X:
            effects: [{ set: drunk }, { adj: purse, by: -10s, why: robbed while drunk }, { adj: hum.Melancholic, by: 1, why: gin }]
            text: You wake on the settle with your purse ten shillings lighter and a duchess’s garter in your hand. Nobody in the room has ever seen a duchess.
        story:
          T: He sat down among them and drank glass for glass with a carter, a coiner and a lady who styled herself a duchess, and was the last of the company upon his legs; which won him the respect of the house, and the duchess’s, and, what is rarer in St Giles, the safe return of his handkerchief.
          X: The gin, which in that house was sold by the quartern and drunk by the pint, prevailed over him at last; and he woke upon the settle ten shillings the poorer, with a garter in his hand which nobody would own.
        next: will
      - label: Take a stool in the corner, and listen.
        dev: Certain
        do:
          effects: [{ adj: hum.Phlegmatic, by: 1, why: listening }]
          text: You sit in the corner and listen. You learn that the Hampstead road is good this autumn, that the Bath road is watched, and that Mr Wild has a man in the house tonight, though nobody will say which.
        next: will

  - id: will
    num: II
    phase: The Complication
    title: An Old Acquaintance of the Road
    sid: blueboar.02.will
    dev: Placeholder · introduces Will Gallow, the canon Hook heath reads
    text: |-
      By the fire sits a long, grey, silent man with a pipe, who has watched you since you came in without once appearing to. The landlord calls him Will. The room gives him a yard of space on every side, as cattle give it to a bull who has never yet charged anyone.

      He takes the pipe out of his mouth. “You’ll be the gentleman,” he says, “as is thinking of the road.”
    ask: What do you say to Will Gallow?
    options:
      - label: Ask him, man to man, how the road is to be learned.
        gate: { when: flags.treated, need: "Standing in the room (stand the gin, or drink level)" }
        dev: Gated · certain · gives the Hook
        do:
          effects: [{ set: will }, { hook: "Will Gallow, an old acquaintance of the road", why: an evening at the Blue Boar }]
          text: Will looks at you a long time. Then he tells you three things. Never ride a horse you cannot afford to lose. Never rob a man who is laughing. And never be in a hurry. He has been on the [[pad]] since Queen Anne’s time, he says, and never once taken, and that is why.
        next: pistols
      - label: Play him a hand of all-fours for a shilling a game.
        dev: Risky · Wit against 4
        check: { attr: Wit, diff: 4 }
        outcomes:
          T:
            effects: [{ set: will }, { loot: 6s, why: won at all-fours }, { hook: "Will Gallow, an old acquaintance of the road", why: beat him at cards }]
            text: You beat him six games in seven. He pays without a word, then laughs, which nobody in the room has heard before. A man who can count cards, he says, can count coaches.
          S:
            effects: [{ set: will }, { hook: "Will Gallow, an old acquaintance of the road", why: an evening’s cards }]
            text: You win some and lose some. He likes the way you lose. By midnight he is telling you about the Hampstead road.
          C:
            effects: [{ set: will }, { adj: purse, by: -3s, why: lost at all-fours }, { hook: "Will Gallow, an old acquaintance of the road", why: an evening’s cards }]
            text: He wins three shillings off you, slowly, and seems to think the better of you for paying them.
          R:
            effects: [{ adj: purse, by: -5s, why: lost at all-fours }]
            text: He wins five shillings, knocks out his pipe and goes back to the fire. You have been weighed, and found to be five shillings.
          X:
            effects: [{ adj: purse, by: -15s, why: lost at all-fours }, { adj: hum.Choleric, by: 1, why: fleeced by a silent man }]
            text: He wins fifteen shillings without speaking a word, and you realise, too late, that he has been reading your cards in the brass of the warming-pan.
        story:
          T: He sat down to all-fours with an old highwayman called Will Gallow, and beat him six games in seven; at which the old man laughed aloud, a thing not heard in that house since the old Queen’s time, and declared that a gentleman who could count cards could count coaches.
          X: Will Gallow won fifteen shillings off him at all-fours without once opening his mouth; and {styled} learned afterwards that the old rogue had read every card in his hand in the bottom of a brass warming-pan which hung behind his chair.
        next: pistols
      - label: Tell him you are already a gentleman of the road, and a bold one.
        dev: Risky · Nerve against 5 · a bluff
        check: { attr: Nerve, diff: 5 }
        outcomes:
          T:
            effects: [{ set: will }, { hook: "Will Gallow, an old acquaintance of the road", why: a bluff he admired }]
            text: He does not believe a word of it, and admires every one. A man who lies that steadily, he says, will stand very steady in a road at night.
          S:
            effects: [{ set: will }, { hook: "Will Gallow, an old acquaintance of the road", why: a bluff he forgave }]
            text: He hears you out with his pipe going, then tells you gently that he can see you have never sat a horse at a coach in your life, and that he will show you how, for a share.
          C:
            effects: [{ set: will }, { hook: "Will Gallow, an old acquaintance of the road", why: a bluff he saw through }, { adj: hum.Choleric, by: 1, why: laughed at }]
            text: He laughs until he coughs. Then he says he will take you on, as a man takes on a puppy.
          R:
            effects: [{ adj: hum.Choleric, by: 1, why: laughed at }]
            text: He says nothing at all, which is worse than laughing, and turns back to the fire.
          X:
            effects: [{ adj: hum.Choleric, by: 1, why: laughed at }, { adj: notoriety, by: 1, why: boasting of robbery in a flash house }]
            text: You say it loudly, which is a mistake, because a man at the next table says it more loudly still, to someone outside.
        next: pistols

  - id: pistols
    num: III
    phase: The Turn
    title: A Brace of Pistols
    sid: blueboar.03.pistols
    dev: Placeholder · the kit heath needs · costed, risky and a refusal
    text: |-
      The woman who keeps the house, a Mrs Gammon, with a face like a closed shop, puts a bundle on the table in front of you and unwraps it. A brace of pistols, one of them of doubtful temper. A crape mask. Fifteen shillings, the lot, and no questions in either direction.

      “For a gentleman as is thinking,” she says.
    ask: Will you buy?
    options:
      - label: Pay her fifteen shillings.
        cost: 15s
        dev: Costed · certain · gives the pistols and the mask
        do:
          effects:
            - { adj: purse, by: -15s, why: pistols and a mask }
            - { set: armed }
            - { item: "A brace of pistols, one doubtful", why: bought of Mrs Gammon }
            - { item: A crape mask, why: bought of Mrs Gammon }
          text: She counts the shillings twice, bites one, and pushes the bundle across. You are now a man with pistols, which is to say a man with a decision to make.
        next: wild
      - label: Haggle with her, as your father haggled for horses.
        dev: Risky · Address against 4 · always gets the pistols; the price and the rumour vary
        check: { attr: Address, diff: 4 }
        outcomes:
          T:
            effects:
              - { adj: purse, by: -5s, why: "pistols and a mask, cheap" }
              - { set: armed }
              - { item: "A brace of pistols, one doubtful", why: bought of Mrs Gammon }
              - { item: A crape mask, why: bought of Mrs Gammon }
            text: You haggle her down to five shillings, and she is so impressed that she throws in a powder-horn and a word of advice, which is to keep the doubtful pistol for show.
          S:
            effects:
              - { adj: purse, by: -10s, why: pistols and a mask }
              - { set: armed }
              - { item: "A brace of pistols, one doubtful", why: bought of Mrs Gammon }
              - { item: A crape mask, why: bought of Mrs Gammon }
            text: Ten shillings. She calls you a hard man, which from Mrs Gammon is a character.
          C:
            effects:
              - { adj: purse, by: -15s, why: pistols and a mask }
              - { set: armed }
              - { item: "A brace of pistols, one doubtful", why: bought of Mrs Gammon }
              - { item: A crape mask, why: bought of Mrs Gammon }
            text: You haggle for a quarter of an hour and pay fifteen shillings, which is what she asked. She seems to have enjoyed it.
          R:
            effects:
              - { adj: purse, by: -15s, why: pistols and a mask }
              - { set: armed }
              - { item: "A brace of pistols, one doubtful", why: bought of Mrs Gammon }
              - { item: A crape mask, why: bought of Mrs Gammon }
              - rumour:
                  id: gammon
                  delay: 2
                  from: Mrs Gammon’s back parlour
                  text: A young Irish gentleman in a Dublin coat has bought a brace of pistols at the Blue Boar. Mrs Gammon thinks Mr Wild may like to know.
                  effect: Notoriety +1
            text: You haggle so hard that she remembers you. You pay her price in the end, and she remembers that too.
          X:
            effects:
              - { adj: purse, by: -£1, why: "pistols and a mask, dear" }
              - { set: armed }
              - { item: "A brace of pistols, one doubtful", why: bought of Mrs Gammon }
              - { item: A crape mask, why: bought of Mrs Gammon }
              - rumour:
                  id: gammon
                  delay: 1
                  from: Mrs Gammon’s back parlour
                  text: A young Irish gentleman, very free with his money, has bought pistols and a mask at the Blue Boar. Mrs Gammon has sold the news to Mr Wild’s people for a crown.
                  effect: Notoriety +2
            text: You lose your temper, and with it the haggle. She takes a pound off you, and sells your face to Mr Wild’s people for a crown before you are out of the court.
        story:
          T: The hostess, one Mrs Gammon, produced a brace of pistols and a crape mask, and named fifteen shillings; but our hero, who had seen his father buy horses at every fair in Connaught, beat her down to five, and she, in admiration, threw in a powder-horn and the best advice he was ever given, which was to keep the worse pistol for show.
          X: In beating down Mrs Gammon he so far forgot himself as to call her a name she did not deserve, or at least had not earned that evening; whereupon she raised her price to a pound, and sold his description to Mr Wild’s people for a crown before he was out of the court.
        next: wild
      - label: Thank her, and leave the bundle where it lies.
        dev: Certain · no pistols, so heath will not be offered
        do:
          effects: [{ adj: hum.Phlegmatic, by: 1, why: prudence }]
          text: You thank her. She wraps the pistols up again with the air of a woman who will sell them to the next fool, and knows exactly how long she will have to wait.
        next: wild

  - id: wild
    num: IV
    phase: The Crisis
    title: Mr Wild’s Man
    sid: blueboar.04.wild
    dev: Placeholder · Press on (risky) or Withdraw (certain)
    text: |-
      The door opens, and the room goes quiet the way a pond goes quiet when a pike comes into it. A broad man in a good coat and a bad wig stands in the doorway, looking at faces. Somebody whispers the name of Mr Wild, and somebody else whispers that it is only one of his people, as if that were better.

      {if flags.armed}You are conscious of the pistols in your pockets, which are suddenly very heavy.{end}
    ask: Press on, or withdraw?
    options:
      - label: "Press on: sit where you are, and meet his eye like a gentleman who has every right to be bored."
        dev: Press on · Nerve against 5
        check: { attr: Nerve, diff: 5, bonus: [{ when: flags.will, by: 1, why: Will Gallow at the fire }] }
        outcomes:
          T:
            effects: [{ set: brazen }, { tag: "Game (the Underworld)", why: outfaced Mr Wild’s man }]
            text: He looks at you. You look back, and yawn. He decides you are a young gentleman of fashion slumming, which is very nearly true, and moves on. When he has gone, the room drinks your health.
          S:
            effects: [{ set: brazen }]
            text: He looks at you for a long moment, and moves on to a carter who looks at him first.
          C:
            effects: [{ set: brazen }, { adj: purse, by: -5s, why: a consideration for Mr Wild’s man }]
            text: He stops at your table and remarks that it is a cold night for a gentleman to be so far from home. You find that five shillings make it warmer.
          R:
            effects:
              - rumour:
                  id: wildsman
                  delay: 2
                  from: Mr Wild’s office, in the Old Bailey
                  text: Mr Wild’s man has taken note of a young Irishman at the Blue Boar, in a fine coat, who looked at him too long.
                  effect: Notoriety +1
            text: He looks at you, and you look back a moment too long. He smiles, and takes out a little book, and writes in it.
          X:
            effects:
              - { adj: notoriety, by: 1, why: marked by a thief-taker }
              - { adj: hum.Melancholic, by: 1, why: a fright }
              - rumour:
                  id: wildsman
                  delay: 1
                  from: Mr Wild’s office, in the Old Bailey
                  text: Mr Wild’s people have the description of a young Irish gentleman who drinks at the Blue Boar, and would be glad of a word with him.
                  effect: Notoriety +1
            text: He comes straight to your table, sits down without being asked, and talks for ten minutes about the weather in {county}, of which he seems to know a great deal. Then he goes. You do not sleep that night.
        story:
          T: At this juncture there entered one of the people of Mr Jonathan Wild, the thief-taker, who looked round the room as a farmer looks over a fold; but our hero met his eye, and yawned in his face, with so perfect an air of fashionable weariness that the fellow took him for a young lord upon a frolic, and passed on.
          X: The thief-taker’s man, singling him out, sat down at his table uninvited, and discoursed for ten minutes upon the weather in the county of {county}, with a familiarity which our hero found more alarming than any threat.
        next: reckon
      - label: "Withdraw: up the back stairs, and out across the leads."
        withdraw: true
        dev: Withdraw · certain
        do:
          effects: [{ set: withdrew }]
          text: You go up the back stairs as if looking for the necessary house, and out of a garret window onto the leads. Half the room seems to know the way. You come down in the next court, among the washing, with a woman shaking a broom at you.
        next: reckon
