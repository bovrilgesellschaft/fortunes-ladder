# yaml-language-server: $schema=schema/settings.schema.json
#
# The run's numbers, from the systems spec. Money as money ("£1 5s"); the engine counts pence.

turn_weeks: 4            # one Venture every four weeks (Ruling)

# Living at a rank, per week: dress, board, servants, chairs (Ruling, systems spec "Money")
living:
  Vagabond: 1s
  Servant: 0d
  Tradesman: 8s
  Gentleman: £1 5s
  Esquire: £3 10s
  Baronet or Knight: £9
  Peer: £25

# A decent room, per week, by district (Ruling). A garret costs half, a first floor double.
lodging:
  St Giles: 7d
  The Savoy: 1s
  Southwark: 1s 6d
  Moorfields: 2s
  Fleet Street and the Strand: 4s
  The City: 5s
  Covent Garden: 6s
  St James's: 15s
  Mayfair: £1
room:
  garret: 0.5
  room: 1
  first floor: 2

# Start date. The systems spec proposes a random week in 1719–1741. Step 5's test runs start in
# January 1724, so that heath (October 1724) comes round in the eleventh turn; set to null for random.
start: { year: 1724, week: 1 }
start_range: { from: 1719, to: 1741 }

# ---------- the core economy (Step 6) ----------
# Canon and Ruling values are marked; the rest are Proposed, for a ruling in the systems spec.
# The Editor quotes none of these prices as fact.
economy:
  # Appearances each rank expects; below it, every Exposure gain is +1 (systems spec)
  expected: { Vagabond: 0, Servant: 0, Tradesman: 4, Gentleman: 8, Esquire: 11, Baronet or Knight: 14, Peer: 16 }
  # Credit = Appearances × this, by Claimed Rank (systems spec)
  credit: { Vagabond: 0d, Servant: 0d, Tradesman: 10s, Gentleman: £3, Esquire: £6, Baronet or Knight: £15, Peer: £40 }
  wear: { worn: 24, shabby: 48 }          # weeks: Fine, then Worn, then Shabby (counts a tier lower)
  # the shops: tiers plain, good, fine. Servant and Equipage are paid by the week.
  catalogue:
    Coat:
      - { name: A plain cloth coat, price: £2 10s }
      - { name: A good broadcloth coat, price: £8 }
      - { name: A fine laced coat, price: £24 }          # Canon (heath's coat)
    Wig:
      - { name: A plain bob wig, price: 15s }
      - { name: A good bag wig, price: £3 }
      - { name: A fine full-bottomed wig, price: £10 }
    Linen:
      - { name: Plain linen shirts, price: 12s }
      - { name: Good Holland shirts, price: £2 }
      - { name: "Fine cambric, with lace ruffles", price: £6 }
    Sword:
      - { name: A plain small-sword, price: £1 }
      - { name: A good small-sword, price: £4 }
      - { name: A silver-hilted small-sword, price: £15 }
    Servant:
      - { name: A boy to run errands, price: 1s 6d }
      - { name: A footman in livery, price: 5s }
      - { name: A valet, price: 10s }
    Equipage:
      - { name: Chairs by the week, price: 5s }
      - { name: "A chair kept, with two chairmen", price: £1 }
      - { name: A jobbed chariot and pair, price: £3 }
  # what the pawnbroker will reckon things worth, besides clothes and swords
  values:
    "A brace of pistols, one doubtful": 15s
    A crape mask: 1s
    "A gold repeating watch, with a coat of arms scratched out": £6
  pawn: { fraction: 0.3333, weeks: 12, redeem: 0.2 }       # a third; held 12 weeks; a fifth to redeem (systems spec)
  lender:
    name: Mr Grubb, a money-scrivener of Chancery Lane
    fee: 0.1          # a tenth kept back (Ruling)
    weekly: 0.01      # 1% a week (Ruling)
    term: 12          # weeks to repay
    grace: 4          # weeks overdue before a writ (systems spec)
    offers: [£5, £10, £20, £50]
  notes: { grace: 4 }  # weeks unpaid before Celebrity falls a point a week (systems spec)
  tradesman: your tailor
  savoy:
    living: Vagabond    # Upkeep falls to the Savoy's level (design document)
    season: 12          # weeks inside before the Savoyard tag
    tag: Savoyard (the Quality)
  prison:
    sponging: £2        # the week in the sponging-house (systems spec)
    room: 2s 6d         # a prison room, a week; the common side is free (systems spec)
    fleet: the Fleet
    marshalsea: the Marshalsea

# ---------- the false self (Step 7) ----------
# Ruling, 18 October 2026 (the Step 7 rulings doc), except where marked Proposed.
personas:
  limit: 2                 # Personas held besides the hero's own name (Ruling)
  # the circles where a name is known are the factions (factions:, below; Step 8, Ruling 5)
  cool_weeks: 8            # Exposure −1 after this many weeks with no gain; not in the Savoy or prison
  closed_weeks: 24         # a blown Persona's circles close to the next one for this long
  blown_celebrity: 2
  secret_diff: 5           # the Wheel on Nerve that decides the Secret
  scandal: { celebrity: 2, notoriety: 1 }   # a Persona made real, at Exposure 10
  sale:
    min: £5
    max: £20
    named_from: 4          # weeks before the buyer, if taken, names his seller
    named_to: 12
    named_exposure: 2
  # The eight kinds (Ruling). The price of the papers and props is Proposed.
  # home: the Origins at home in the kind (Exposure −1 at the start, and the test waived).
  # The Strolling player is at home in every kind.
  kinds:
    - id: captain
      name: A captain late of a foreign service
      rank: Gentleman
      sex: man
      needs: A sword, and a tale of a campaign
      test: has_item_like("sword")
      cost: £2
      home: [younger-son, discharged-sailor, strolling-player]
      titles: { man: [{ long: Captain, short: Capt. }] }
      surnames: [Dillon, Lally, Sarsfield, Butler, Walsh, Fitzjames, Burke, Rooth]
      claims: [late of the Imperial service, late of the French service, late of the Spanish service, late of the Sardinian service]
    - id: widow
      name: An officer's widow
      rank: Gentleman
      sex: woman
      needs: Mourning, and a pension story
      cost: £4
      home: [curates-daughter, strolling-player]
      titles: { woman: [{ long: Mrs, short: Mrs }] }
      surnames: [Delacourt, Harcourt, Vane, Ormsby, Lisle, Fenwick, Carew, Stanhope]
      claims: [widow of a colonel of dragoons, widow of a captain lost at Vigo, widow of a major of the Guards]
    - id: clergyman
      name: A clergyman without a living
      rank: Gentleman
      sex: man
      needs: Gown and bands, and some Latin (Learning 2)
      test: attrs.Learning >= 2
      cost: £3
      home: [curates-daughter, foundling, strolling-player]
      titles: { man: [{ long: the Reverend Mr, short: the Rev. Mr }] }
      surnames: [Ashby, Prideaux, Whitlock, Mayne, Thursby, Gell, Hoadly, Venn]
      claims: [late chaplain to a regiment of foot, a Fellow of a college without a living, a clergyman waiting on a bishop]
    - id: physician
      name: A physician with a foreign degree
      rank: Gentleman
      sex: man
      needs: A diploma, bought or forged
      test: attrs.Learning >= 1
      cost: £5
      home: [barbers-apprentice, strolling-player]
      titles: { man: [{ long: Doctor, short: Dr }] }
      surnames: [Hollis, Rowley, Ingram, Petty, Lowther, Quincy, Sydall, Mead]
      claims: [Doctor of Physic of Leiden, Doctor of Physic of Padua, Doctor of Physic of Rheims]
    - id: heiress
      name: A country heiress come to town
      rank: Gentleman
      sex: woman
      needs: A trunk, a chaperone, and a rumoured fortune
      cost: £6
      home: [country-innocent, strolling-player]
      titles: { woman: [{ long: Miss, short: Miss }] }
      surnames: [Fairfax, Lumley, Wentworth, Trelawny, Hungerford, Pelham, Courtenay, Mordaunt]
      claims: [heiress to an estate in Yorkshire, heiress to an estate in Cornwall, heiress to a Bristol fortune]
    - id: natural-child
      name: A great man's natural son or daughter
      rank: Esquire
      sex: either
      needs: A ring or a letter, and a resemblance
      test: attrs.Countenance >= 2
      cost: £5
      home: [foundling, younger-son, strolling-player]
      titles: { man: [{ long: Mr, short: Mr }], woman: [{ long: Miss, short: Miss }] }
      surnames: [FitzClarence, Fitzhardinge, Fitzwalter, Beauclair, Fitzosborne, Fitzgerald]
      claims: [natural child of a duke, natural child of an earl, natural child of a late Lord Lieutenant]
    - id: honourable
      name: The Honourable Mr —, a lord's brother
      rank: Esquire
      sex: man
      needs: The lord's papers and wardrobe
      test: appearances >= 12
      cost: £8
      home: [valet, strolling-player]
      titles: { man: [{ long: the Honourable Mr, short: the Hon. Mr }] }
      surnames: [Tremayne, Darcy, Annesley, Villiers, Talbot, Savile]
      claims: [brother to a lord in Ireland, brother to a Scotch lord, brother to a lord now abroad]
    - id: count
      name: A count of the Empire
      rank: Baronet or Knight
      sex: either
      needs: A foreign accent, a patent, and an equipage
      test: equipage >= 2            # a chair kept, or a chariot
      cost: £15
      home: [strolling-player]
      titles: { man: [{ long: Count, short: Count }], woman: [{ long: Countess, short: Countess }] }
      surnames: [Montalbano, Strahlenfels, Vorlenberg, Taliani, Brisacier, Rosental]
      claims: [of the Holy Roman Empire, of the Empire, by a patent from Vienna]

# ---------- humours and Reputation (Step 8) ----------
# Ruling, 20 October 2026 (the Step 8 rulings doc).

# The nine factions and the Town, for fame that runs everywhere (design document). Reputation is
# kept by them, and they are also the circles where a name is known.
factions: [the Quality, the Church, the Law, the Projectors, the Army & Navy, the Underworld, the Wits, the Trade, the Brethren & the Adepts, the Town]

humours:
  peak: 5                      # an Affliction begins
  relieved_at: 3               # and ends when the humour falls this far
  afflictions: { Sanguine: Prodigal, Choleric: Quarrelsome, Melancholic: Hipped, Phlegmatic: Torpid }
  prodigal_upkeep: 1.5         # Upkeep ×1.5; certain costed options cost double
  torpid_offers: 2
  quarrel: quarrel             # the Venture a Quarrelsome hero is always offered
  # the engine's own rises, once per humour per turn
  rises: { spoils: £10, loss: £10 }
  relief:
    vice: { by: 2, notoriety: 0.25 }
    religion: { by: 2, tag: Pious (the Church), moorfields: { year: 1739, week: 17 } }
    physician: { by: 1, fee: 1 guinea, attr: Constitution, diff: 3, condition: Physicked (bled and purged), weeks: 4 }

tags:
  limit: 3                     # Tags per faction; a fourth pushes out the oldest
  lapse: 48                    # weeks after a Tag was last earned
  # Every Tag the content may use. good/bad is how factions generally take it; except lists those
  # who take it the other way. lasts: weeks, or "for good"; the default is the lapse above.
  register:
    Wit:            { valence: good, opposite: Dull }
    Dull:           { valence: bad, opposite: Wit }
    Rake:           { valence: bad, except: [the Town, the Wits, the Trade], opposite: Pious }
    Pious:          { valence: good, except: [the Wits, the Underworld], opposite: Rake }
    Brave:          { valence: good, opposite: Coward }
    Coward:         { valence: bad, opposite: Brave }
    Generous:       { valence: good }
    Cheat:          { valence: bad, except: [the Underworld], opposite: Man of Honour }
    Man of Honour:  { valence: good, opposite: Cheat }
    Gallant:        { valence: good }
    Agreeable:      { valence: good }
    Learned:        { valence: good }
    Man of Fashion: { valence: good }
    Game:           { valence: good, opposite: Coward }
    Absurd:         { valence: bad }
    Fast:           { valence: bad, except: [the Town, the Trade], opposite: Pious }
    Cruel:          { valence: bad, except: [the Underworld], opposite: Generous }
    Ruthless:       { valence: bad, except: [the Underworld], opposite: Generous }
    Fortune-hunter: { valence: bad, lasts: 24 }
    Savoyard:       { valence: bad, lasts: for good }
    Brother:        { valence: good, lasts: for good }

# ---------- the score (systems spec, Ruling; Step 9) ----------
score:
  celebrity: 10        # Subscribers per point of peak Celebrity
  climbed: 20          # per rank climbed from arrival to the peak
  fallen: 20           # per rank lost from the peak to the end
  altered: 5           # per named character altered (a person named in a Hook gained; Step 9)
  endings: { apotheosis: 50, retirement: 20, transportation: 20, ruin: 10, death: 0 }
  ruin_weeks: 48       # a year in prison without release ends the run in Ruin (Step 9)
  last_year: 1745      # the run ends with this year (canon's window)
