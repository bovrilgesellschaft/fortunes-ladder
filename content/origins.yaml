# yaml-language-server: $schema=schema/origins.schema.json
#
# The eight Origins the game ships with (design document; sexes by the ruling of 18 October 2026).
# Only an Origin marked available can be played; Step 19 fills in the rest.
# Starting figures are the systems spec's (Proposed) unless marked.

- id: younger-son
  name: Younger son of an Irish squire
  sex: man
  arrives: The Holyhead coach to Charing Cross
  strengths: Rank (claimed), sword
  secret: No estate, only a name and a debt
  available: true
  arrival: holyhead-coach
  hero:
    # Drawn afresh for each run, or chosen by the player. Cornelius Byrne, alias Capt. O’Rourke,
    # remains the canon sample hero of heath. Galway names lean on the Tribes of Galway.
    names:
      given: [Cornelius, Dermot, Terence, Hugh, Owen, Denis, Florence, Thady, Felix, Redmond, Ulick, Garret, Phelim, Lucius, Edmund, Brian]
      surname: [Byrne, Daly, Kirwan, Lynch, Blake, Bodkin, Skerrett, Joyce, Martin, D’Arcy, Browne, Madden, Kelly, Burke, Molloy, Nugent]
      county: [Galway, Mayo, Clare, Roscommon, Sligo, Tipperary, Limerick, Kerry]
      alias:
        title:
          - { long: Captain, short: Capt. }
          - { long: Captain, short: Capt. }
          - { long: Major, short: Maj. }
        surname: [O’Rourke, MacMahon, Fitzgerald, O’Connor, Macnamara, Plunkett, O’Brien, Kavanagh, Magennis, O’Neill, MacCarthy, O’Donnell]
        claim: [late of the Imperial service, late of the French service, late of the Spanish service]
    true_rank: Gentleman
    claimed_rank: Gentleman
    lodging: { district: Fleet Street and the Strand, room: garret }
    alias_kind: captain              # the kind of Persona the arrival grants (Step 7)
    # The Secret (Step 7 ruling): what it costs when it comes out, and the Hook for a late reversal.
    secret_out:
      credit_rank: Tradesman         # Credit reckoned at this rank's multiplier
      weeks: 24
      tag: Fortune-hunter (the Quality)
      hook: An elder brother in {county}, in possession and in poor health
      letter:
        from: The Grecian, in Devereux Court
        text: >-
          A letter has come up from {county}, written by a gentleman who knew your father. It
          describes the family estate with great exactness: a house with half a roof, two hundred
          acres of bog, and an elder brother in possession of both. By Thursday the
          [[Grecian]] has improved the bog by an [[Irish mile]].
      story:
        heading: In which the Town learns the Extent of an Estate
        text: >-
          It was at this juncture that a letter came up from {county}, describing his patrimony with
          a cruel exactness; and the Town, which had lent to {name} upon an estate, discovered that
          it had lent upon a bog.
      reversal:
        hook: An elder brother in    # the Hook that must be held
        chance: 0.15                 # at each new year (Proposed)
        true_rank: Esquire
        letter:
          from: An attorney at {county} assizes
          text: >-
            Your brother died at Christmas, of a fever caught in a wet field, and lies in the family
            vault, which is the one part of the house with a sound roof. The estate is yours: the
            house, the bog, and the mortgages, of which there are three. You are an Esquire, and
            your creditors were told before you were.
        story:
          heading: In which our Hero comes into his Inheritance, and his Creditors into theirs
          text: >-
            News came from {county} that his brother was dead; and {name}, who had for so long passed
            for a man of estate, found himself one at last, with this difference only, that the estate
            was real and the money was not.
    # a Gentleman's expected 8 exactly (Proposed)
    dress:
      Coat: { tier: 3, name: "A fine coat, made in Dublin and not paid for" }
      Wig: { tier: 1, name: A plain bob wig }
      Linen: { tier: 2, name: Good Holland shirts }
      Sword: { tier: 2, name: His father’s sword }
    start:
      purse: £5                      # systems spec, starting purse by Origin
      debts: £20                     # to a Dublin tailor
      luck: 1
      exposure: 0                    # under his own name
      notoriety: 0
      celebrity: 0
      # two Origin strengths at 3, the rest at 2, Learning 0–2 (systems spec); "Rank and sword" read as Address and Nerve
      attrs: { Address: 3, Wit: 2, Nerve: 3, Constitution: 2, Countenance: 2, Learning: 1 }
      hum: { Sanguine: 1, Choleric: 1, Melancholic: 0, Phlegmatic: 0 }
      tags: []
      items:
        - His father’s sword
        - A fine coat, made in Dublin and not paid for
        - A plain bob wig
        - Good Holland shirts
      hooks: []

- id: foundling
  name: Foundling
  sex: either
  arrives: On foot along the Oxford road
  strengths: Address, Nerve
  secret: Unknown parentage; a recognition scene may reveal noble blood or a hanged mother
  available: false

- id: country-innocent
  name: Country innocent
  sex: either
  arrives: The York waggon to the Bell, Wood Street
  strengths: Countenance, Nerve
  secret: A seducer at home, and a bawd already waiting in the inn yard
  available: false

- id: barbers-apprentice
  name: Barber's apprentice
  sex: man
  arrives: Runaway, by the Dover road into Southwark
  strengths: Wit, surgery, gossip
  secret: Indentures broken; a master with a claim
  available: false

- id: curates-daughter
  name: Curate's daughter
  sex: woman
  arrives: The Bath coach, with one trunk
  strengths: Learning, Countenance
  secret: A ruined reputation from the parish
  available: false

- id: valet
  name: Valet to a ruined lord
  sex: man
  arrives: Following his master's creditors to town
  strengths: Manners, wardrobe
  secret: Took the lord's clothes, papers and name
  available: false

- id: strolling-player
  name: Strolling player
  sex: either
  arrives: With a booth company for Bartholomew Fair
  strengths: Personas, disguise
  secret: A vagrancy conviction
  available: false

- id: discharged-sailor
  name: Discharged sailor
  sex: man
  arrives: Paid off at Wapping with a pocket of prize money
  strengths: Constitution, cant
  secret: Deserted, or so the Navy says
  available: false
